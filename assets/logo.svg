<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="cgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cgTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Globe Circuit Icon (Left side) -->
  <g transform="translate(50, 50)" filter="url(#glowEffect)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="36" stroke="url(#cgGlow)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.85" fill="none"/>
    <circle cx="0" cy="0" r="30" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.9"/>
    
    <!-- Latitude & Longitude Arc Lines -->
    <ellipse cx="0" cy="0" rx="16" ry="30" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.75"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="1.5" opacity="0.75"/>
    <line x1="-24" y1="-15" x2="24" y2="-15" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
    <line x1="-24" y1="15" x2="24" y2="15" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
    
    <!-- Circuit Lines & Nodes -->
    <path d="M 0 -30 L 0 -12 L 12 0 L 25 0" stroke="#00F2FE" stroke-width="2" fill="none"/>
    <path d="M -20 -10 L -8 0 L -8 18 L 0 26" stroke="#00F2FE" stroke-width="2" fill="none"/>
    <path d="M -15 15 L 0 0 L 15 15" stroke="#60A5FA" stroke-width="1.5" fill="none"/>

    <!-- Glowing Nodes / Junctions -->
    <circle cx="0" cy="-30" r="3.5" fill="#00F2FE"/>
    <circle cx="25" cy="0" r="3.5" fill="#00F2FE"/>
    <circle cx="-20" cy="-10" r="3" fill="#38BDF8"/>
    <circle cx="0" cy="26" r="3.5" fill="#00F2FE"/>
    <circle cx="12" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="-8" cy="18" r="2.5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#00F2FE"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography: CORATECH GLOBAL -->
  <text x="105" y="47" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="url(#cgTextGrad)">
    CORATECH
  </text>
  <text x="106" y="70" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="7.5" fill="#00F2FE">
    GLOBAL
  </text>
</svg>
